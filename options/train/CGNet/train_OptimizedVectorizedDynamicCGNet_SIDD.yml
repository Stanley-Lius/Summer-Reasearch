# general settings
name: train_OptimizedVectorizedDynamicCGNet_PSNRloss_mixup_SIDD
model_type: CGNetModel
scale: 1
num_gpu: 1
dist: false
manual_seed: 100

# dataset and data loader settings
datasets:
  train:
    name: SIDD_Train
    type: PairedImageDataset
    dataroot_gt: ./SIDD/train/gt_crops.lmdb
    dataroot_lq: ./SIDD/train/input_crops.lmdb
    filename_tmpl: '{}'
    io_backend:
      type: lmdb

    gt_size: 256
    use_hflip: true
    use_rot: true

    # data loader
    use_shuffle: true
    num_worker_per_gpu: 6
    batch_size_per_gpu: 8

    ### -------------Progressive training--------------------------
    mini_batch_sizes: [8, 6, 4, 2]              # Lowered to prevent OOM for width=32
    iters: [100000, 100000, 100000, 100000]
    gt_sizes: [128, 160, 192, 256]              # Patch sizes
    ### ------------------------------------------------------------

    dataset_enlarge_ratio: 1
    prefetch_mode: ~

  val:
    name: SIDD_Val
    type: PairedImageDataset
    dataroot_gt: ./SIDD/val/gt_crops.lmdb
    dataroot_lq: ./SIDD/val/input_crops.lmdb
    io_backend:
      type: lmdb

# network structures
network_g:
  type: OptimizedVectorizedDynamicCGNet
  img_channel: 3
  width: 32
  middle_blk_num: 10
  enc_blk_nums: [2, 2, 4, 6]
  dec_blk_nums: [2, 2, 2, 2]
  context_num_scales: 4
  context_max_radius: 4

# path
path:
  pretrain_network_g: ~
  strict_load_g: true
  resume_state: ~

# training settings
train:
  use_amp: true       # Enables Automatic Mixed Precision to save 40%+ VRAM
  ema_decay: 0.999    # Added EMA
  total_iter: 400000
  warmup_iter: -1
  use_grad_clip: true
  grad_clip_norm: 0.01

  scheduler:
    type: CosineAnnealingRestartLR
    periods: [400000]
    restart_weights: [1]
    eta_min: !!float 1e-7

  mixing_augs:
    mixup: true
    mixup_beta: 1.2
    use_identity: true

  optim_g:
    type: AdamW
    lr: !!float 2e-4
    weight_decay: 0
    betas: [0.9, 0.9]

  # losses
  pixel_opt:
    type: PSNRLoss
    loss_weight: 1
    reduction: mean

# validation settings
val:
  window_size: 16
  val_freq: !!float 2e4
  save_img: false
  rgb2bgr: true
  use_image: false

  metrics:
    psnr:
      type: calculate_psnr
      crop_border: 0
      test_y_channel: false

# logging settings
logger:
  print_freq: 100
  save_checkpoint_freq: !!float 5e4
  use_tb_logger: true
  wandb:
    project: ~
    resume_id: ~
