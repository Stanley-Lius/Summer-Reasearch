# general settings
name: train_LiteKimiSWSformerSpiralRoPE_SIDD
model_type: ImageRestorationModel
scale: 1
num_gpu: 1
dist: false
manual_seed: 100

# dataset and data loader settings
datasets:
  train:
    name: SIDD_Train
    type: PairedImageDataset
    dataroot_gt: /media/stanley/AA5E237A5E233F07/BasicSR/SIDD/train/gt_crops.lmdb
    dataroot_lq: /media/stanley/AA5E237A5E233F07/BasicSR/SIDD/train/input_crops.lmdb
    filename_tmpl: '{}'
    io_backend:
      type: lmdb

    gt_size: 256
    use_hflip: true
    use_rot: true

    # data loader
    use_shuffle: true
    num_worker_per_gpu: 4
    batch_size_per_gpu: 2
    dataset_enlarge_ratio: 1
    prefetch_mode: ~

  val:
    name: SIDD_Val
    type: PairedImageDataset
    dataroot_gt: /media/stanley/AA5E237A5E233F07/BasicSR/SIDD/val/gt_crops.lmdb
    dataroot_lq: /media/stanley/AA5E237A5E233F07/BasicSR/SIDD/val/input_crops.lmdb
    io_backend:
      type: lmdb

# network structures
network_g:
  type: LiteKimiSWSformerSpiralRoPE
  img_channel: 3
  width: 64
  middle_blk_num: 8
  enc_blk_nums: [2, 2, 4, 8]
  dec_blk_nums: [2, 2, 2, 2]
  win_size: 16
  sub_win_size: 8
  nwc_ks: [7, 5, 3, 3, 3]
  num_heads: [1, 2, 4, 8, 16]
  use_peg: true
  rope_in_kda: true
  rope_in_mla: true

# path
path:
  pretrain_network_g: ~
  strict_load_g: true
  resume_state: ~

# training settings
train:
  optim_g:
    type: AdamW
    lr: !!float 5e-4
    weight_decay: 0.
    betas: [0.9, 0.9]

  scheduler:
    type: TrueCosineAnnealingLR
    T_max: 816212
    eta_min: !!float 1e-7

  total_iter: 816212
  warmup_iter: -1 # no warm up

  # losses
  pixel_opt:
    type: PSNRLoss
    loss_weight: 1
    reduction: mean

# validation settings
val:
  val_freq: !!float 50000     # 【安全防護】降為 5000 步驗證一次，能提早發現 OOM，不用等 8 小時
  save_img: false
  use_image: false

  metrics:
    psnr:
      type: calculate_psnr
      crop_border: 0
      test_y_channel: false
    ssim:
      type: calculate_ssim
      crop_border: 0
      test_y_channel: false

# logging settings
logger:
  print_freq: 1000           # 每 1000 步印出一次
  save_checkpoint_freq: 5000 # 備份頻率對齊驗證頻率，確保做白工的時間最小化
  use_tb_logger: true
  wandb:
    project: ~
    resume_id: ~

# dist training settings
dist_params:
  backend: nccl
  port: 29500
