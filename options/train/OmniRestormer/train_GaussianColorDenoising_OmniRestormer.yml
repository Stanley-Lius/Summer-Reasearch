# general settings
name: train_GaussianColorDenoising_OmniRestormer_RTX3060
model_type: OmniRestormerModel
scale: 1
num_gpu: 1  # Modified for RTX 3060 (1 GPU)
dist: false # Modified for single GPU training
manual_seed: 100

# dataset and data loader settings
datasets:
  train:
    name: SIDD_Train
    type: PairedImageDataset
    dataroot_gt: ./SIDD/train/gt_crops.lmdb
    dataroot_lq: ./SIDD/train/input_crops.lmdb
    filename_tmpl: '{}'
    io_backend:
      type: lmdb

    gt_size: 128
    use_hflip: true
    use_rot: true

    # data loader
    use_shuffle: true
    num_worker_per_gpu: 4
    batch_size_per_gpu: 10
    dataset_enlarge_ratio: 1
    prefetch_mode: ~

  val:
    name: SIDD_Val
    type: PairedImageDataset
    dataroot_gt: ./SIDD/val/gt_crops.lmdb
    dataroot_lq: ./SIDD/val/input_crops.lmdb
    io_backend:
      type: lmdb

# network structures
network_g:
  type: OmniRestormerNet
  img_channel: 3
  width: 32
  middle_blk_num: 1
  enc_blk_nums: [1, 1, 2, 3]
  dec_blk_nums: [1, 1, 1, 1]
  DW_Expand: 2
  FFN_Expand: 2
  drop_out_rate: 0.0
  heads: [1, 2, 4, 8]

# path
path:
  pretrain_network_g: ~
  strict_load_g: true
  resume_state: /media/stanley/AA5E237A5E233F07/BasicSR/experiments/train_GaussianColorDenoising_OmniRestormer_RTX3060/training_states/204000.state

# training settings
train:
  total_iter: 300000
  warmup_iter: -1 # no warm up
  use_grad_clip: true

  scheduler:
    type: CosineAnnealingRestartLR
    periods: [400000]
    restart_weights: [1]
    eta_min: !!float 1e-7

  mixing_augs:
    mixup: true
    mixup_beta: 1.2
    use_identity: true

  optim_g:
    type: AdamW
    lr: !!float 3e-4
    weight_decay: !!float 1e-4
    betas: [0.9, 0.999]

  # losses
  pixel_opt:
    type: L1Loss
    loss_weight: 1
    reduction: mean

# validation settings
val:
  window_size: 8  # Will be handled gracefully internally
  val_freq: !!float 4e3
  save_img: false
  rgb2bgr: true
  use_image: false
  max_minibatch: 4

  metrics:
    psnr:
      type: calculate_psnr
      crop_border: 0
      test_y_channel: false

# logging settings
logger:
  print_freq: 1000
  save_checkpoint_freq: !!float 4e3
  use_tb_logger: true
  wandb:
    project: ~
    resume_id: ~
