name: test_LoopLiteNoPoolKimiSWSformer_SIDD
model_type: ImageRestorationModel
scale: 1
num_gpu: 1
manual_seed: 1111

datasets:
  test_1:
    name: SIDD_val
    type: PairedImageDataset
    dataroot_gt: SIDD/val/gt_crops.lmdb
    dataroot_lq: SIDD/val/input_crops.lmdb
    io_backend:
      type: lmdb

network_g:
  type: LoopLiteNoPoolKimiSWSformer
  width: 64
  enc_h_cycles: [1, 1, 2, 2]
  enc_l_cycles: [1, 1, 3, 3]
  mid_h_cycles: 2
  mid_l_cycles: 3
  dec_h_cycles: [1, 1, 1, 1]
  dec_l_cycles: [1, 1, 1, 1]
  win_size: 16
  sub_win_size: 8
  nwc_ks: [7, 5, 3, 3, 3]
  num_heads: [1, 2, 4, 8, 16]
  use_visual_anchor: true
  use_selective_backprop: true

path:
  pretrain_network_g: experiments/train_LoopLiteNoPoolKimiSWSformer_SIDD/models/net_g_latest.pth
  strict_load_g: true

val:
  suffix: ~
  window_size: 16
  save_img: true
  rgb2bgr: true
  use_image: false
  metrics:
    psnr:
      type: calculate_psnr
      crop_border: 0
      test_y_channel: false
    ssim:
      type: calculate_ssim
      crop_border: 0
      test_y_channel: false
