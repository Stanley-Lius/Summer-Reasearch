# general settings
name: test_LiteKimiSWSformerSpiralRoPE_SIDD
model_type: ImageRestorationModel
scale: 1
num_gpu: 1
manual_seed: 100

datasets:
  test:
    name: SIDD_Test
    type: PairedImageDataset
    dataroot_gt: SIDD/val/gt_crops.lmdb
    dataroot_lq: SIDD/val/input_crops.lmdb
    io_backend:
      type: lmdb

# network structures
network_g:
  type: LiteKimiSWSformerSpiralRoPE
  img_channel: 3
  width: 16
  middle_blk_num: 1
  enc_blk_nums: [2, 2, 2, 2]
  dec_blk_nums: [2, 2, 2, 2]
  win_size: 16
  sub_win_size: 8
  nwc_ks: [7, 5, 3, 3, 3]
  num_heads: [1, 2, 4, 8, 16]
  use_peg: true
  rope_in_kda: true
  rope_in_mla: true

# path
path:
  pretrain_network_g: experiments/train_LiteKimiSWSformerSpiralRoPE_SIDD/models/net_g_latest.pth
  strict_load_g: true
  resume_state: ~

# validation settings
val:
  save_img: true
  rgb2bgr: true
  use_image: false
  window_size: 16

  metrics:
    psnr:
      type: calculate_psnr
      crop_border: 0
      test_y_channel: true
    ssim:
      type: calculate_ssim
      crop_border: 0
      test_y_channel: true
