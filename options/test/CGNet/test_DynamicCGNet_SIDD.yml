name: test_OmniDirDynamicCGNet_doubleGate_0727_SIDD
model_type: CGNetModel
scale: 1
num_gpu: 1
manual_seed: 100

datasets:
  test_1:
    name: SIDD_Val
    type: PairedImageDataset
    dataroot_gt: ./SIDD/val/gt_crops.lmdb
    dataroot_lq: ./SIDD/val/input_crops.lmdb
    io_backend:
      type: lmdb

# network structures
network_g:
  type: OmniDirDynamicCGNet
  img_channel: 3
  width: 32
  middle_blk_num: 10
  enc_blk_nums: [2, 2, 4, 6]
  dec_blk_nums: [2, 2, 2, 2]

# path
path:
  pretrain_network_g: experiments/train_OmniDirDynamicCGNet_doublegate_SIDD_multiFeaturemaps/models/net_g_latest.pth
  strict_load_g: true

# validation settings
val:
  suffix: ~
  window_size: 8
  save_img: true
  rgb2bgr: true
  use_image: false
  metrics:
    psnr:
      type: calculate_psnr
      crop_border: 0
      test_y_channel: false
    ssim:
      type: calculate_ssim
      crop_border: 0
      test_y_channel: false
