name: test_VectorizedDynamicCGNet_SIDD
model_type: CGNetModel
scale: 1
num_gpu: 1
manual_seed: 100

datasets:
  test_1:
    name: SIDD_Val
    type: PairedImageDataset
    dataroot_gt: ./datasets/SIDD/val/gt_crops.lmdb
    dataroot_lq: ./datasets/SIDD/val/input_crops.lmdb
    io_backend:
      type: lmdb

# network structures
network_g:
  type: VectorizedDynamicCGNet
  img_channel: 3
  width: 32
  middle_blk_num: 10
  enc_blk_nums: [2, 2, 4, 6]
  dec_blk_nums: [2, 2, 2, 2]
  context_num_scales: 4
  context_max_radius: 4

# path
path:
  pretrain_network_g: ~ # fill in with experiments/train_VectorizedDynamicCGNet_SIDD/models/net_g_latest.pth after training
  strict_load_g: true

# validation settings
val:
  suffix: ~
  window_size: 8
  save_img: true
  rgb2bgr: true
  use_image: false
  metrics:
    psnr:
      type: calculate_psnr
      crop_border: 0
      test_y_channel: false
    ssim:
      type: calculate_ssim
      crop_border: 0
      test_y_channel: false
